services:
  mysql:
    image: mysql:8.0
    container_name: clubsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: clubsphere
      MYSQL_DATABASE: clubsphere_db
    ports:
      - "3307:3306"
    volumes:
      - clubsphere-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pclubsphere"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: clubsphere-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/clubsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: clubsphere
      APP_BASE_URL: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  clubsphere-mysql-data:
