# Database Connection Settings
# Environment variables DB_URL / DB_USERNAME / DB_PASSWORD override these values.
# Never commit a real password. See .env.example.
db.url=jdbc:mysql://localhost:3306/clubsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=CHANGE_ME

# HikariCP Pool Configuration
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1800000

# Application Configuration
# APP_BASE_URL / APP_UPLOAD_DIR environment variables override these values.
app.name=Arya College ClubSphere
app.college.name=Arya College of Engineering & IT, Jaipur
app.base.url=http://localhost:8080/aryaClgClubSphere
app.upload.dir=uploads
